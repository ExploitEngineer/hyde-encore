# Encore layout
# Album art, now playing and a live word-by-word lyric line from encore.
# Wallbash generated layout. Needs the encore service for lyrics
# (`hyde-shell encore daemon`, or `[encore] enable = true` in config.toml);
# without it the lyric line stays empty and the rest still works.

# Local Variables
$fontFamily = JetBrainsMono Nerd Font
# A plain `cat` of the line encore writes, so updating it 10 times a second stays cheap.
$ENCORE_LYRIC = cat "$XDG_RUNTIME_DIR/hyde/encore.hyprlock" 2>/dev/null
$LAST_PLAYER = "$(playerctl -l | tail -n1)"

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# BACKGROUND
background {
    monitor =
    path = $BACKGROUND_PATH
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

# TIME
label {
    monitor =
    text = $TIME
    color = $wallbash_txt1_rgba
    font_size = 64
    font_family = $fontFamily Bold
    position = 0, -6%
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    color = $wallbash_txt2_rgba
    font_size = 16
    font_family = $fontFamily
    position = 0, -16%
    halign = center
    valign = top
}

# ALBUM ART
image {
    monitor =
    path = $MPRIS_IMAGE
    size = 260 # lesser side if not 1:1 ratio
    rounding = 18
    border_size = 0
    reload_time = 0 # reloaded with SIGUSR2 by hyprlock.sh when the track changes
    position = 0, 9%
    halign = center
    valign = center
}

# TITLE (also refreshes $MPRIS_IMAGE)
label {
    monitor =
    text = cmd[update:1000] $MPRIS_TITLE
    color = $wallbash_txt1_rgba
    font_size = 22
    font_family = $fontFamily Bold
    position = 0, -7%
    halign = center
    valign = center
}

# ARTIST
label {
    monitor =
    text = cmd[update:1000] $MPRIS_ARTIST
    color = $wallbash_txt2_rgba
    font_size = 15
    font_family = $fontFamily
    position = 0, -11%
    halign = center
    valign = center
}

# LYRIC LINE (sung words in the album accent, the rest dimmed)
label {
    monitor =
    text = cmd[update:100] $ENCORE_LYRIC
    color = $wallbash_txt1_rgba
    font_size = 26
    font_family = $fontFamily Bold
    position = 0, -19%
    halign = center
    valign = center
}

# Prev button
label {
    monitor =
    text = cmd[update:1000] { playerctl status -p $LAST_PLAYER | grep -q "Playing" ;} && echo "󰒮"
    onclick = playerctl -p $LAST_PLAYER previous && pkill -u $USER -SIGUSR2 hyprlock
    color = $wallbash_txt2_rgba
    font_size = 20
    font_family = $fontFamily Bold
    position = -3%, -26%
    halign = center
    valign = center
}

# Play/Pause button
label {
    monitor =
    text = cmd[update:1000] player=$LAST_PLAYER; [ -z "$player" ] && echo "" || (playerctl status -p "$player" 2>/dev/null | grep -q '^Playing$' && echo "⏸" || echo "▶")
    onclick = playerctl -p $LAST_PLAYER play-pause
    color = $wallbash_txt2_rgba
    font_size = 20
    font_family = $fontFamily Bold
    position = 0, -26%
    halign = center
    valign = center
}

# Next button
label {
    monitor =
    text = cmd[update:1000] { playerctl status -p $LAST_PLAYER | grep -q "Playing" ;} && echo "󰒭"
    onclick = playerctl -p $LAST_PLAYER next && pkill -u $USER -SIGUSR2 hyprlock
    color = $wallbash_txt2_rgba
    font_size = 20
    font_family = $fontFamily Bold
    position = 3%, -26%
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 220, 46
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = $wallbash_pry4_rgba
    inner_color = $wallbash_pry2_rgba
    font_color = $wallbash_3xa9_rgba
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = -1
    check_color = $wallbash_pry4_rgba
    fail_color = rgba(FF0000FF)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = true
    position = 0, 4.5%
    halign = center
    valign = bottom
}

# Battery Status if present
label {
    monitor =
    text = cmd[update:5000] $BATTERY_ICON
    color = $wallbash_4xa9_rgba
    font_size = 20
    font_family = $fontFamily
    position = -1%, 1%
    halign = right
    valign = bottom
}

# Current Keyboard Layout
label {
    monitor =
    text = $LAYOUT
    color = $wallbash_4xa9_rgba
    font_size = 20
    font_family = $fontFamily
    position = -2%, 1%
    halign = right
    valign = bottom
}

# Fingerprint Prompts
label {
    text = $FPRINTPROMPT
    color = $wallbash_txt2_rgba
    font_size = 16
    position = 0, 2%
    halign = center
    valign = bottom
}

label {
    text = $FPRINTFAIL
    color = rgba(FF7070FF)
    font_size = 14
    position = 0, 5%
    halign = center
    valign = bottom
}
