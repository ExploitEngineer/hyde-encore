# Fragment for upstream Configs/.local/share/hyde/schema/config.toml.
# Merge these sections in; generated upstream by ./gen-config.py from schema.toml.

# Generic desktop autostart configuration (encore entry only).
[desktop.start]
encore = "hyde-shell app -u hyde-$XDG_SESSION_DESKTOP-encore.service -t service -- encore.sh daemon --if-enabled"  # encore lyrics service, runs only when [encore] enable = true.

# encore.py configuration: word-by-word synced lyrics and album colors.
[encore]
enable = false  # Start the encore service with the session.
players = []  # Only follow these MPRIS players, e.g. ["spotify"]. Empty follows any player.

# encore lyrics sources.
[encore.lyrics]
lrclib = true  # Fetch lyrics from lrclib.net.
spicy_key = ""  # Spicy Lyrics API key (sl_sk_...) for word-level sync on Spotify. Get one at developers.spicylyrics.org.
dirs = []  # Extra folders with 'Artist - Title.lrc' files. Defaults to $XDG_DATA_HOME/lyrics and ~/Music/Lyrics.

# Lyrics overlay ('hyde-shell encore toggle').
[encore.overlay]
enable = false  # Start the overlay with the encore service.
position = "bottom"  # Overlay block position: top, center or bottom.
margin = 120  # Pixels between the overlay and the anchored screen edge.
font = "SF Pro Display, Inter, Cantarell, sans-serif"  # Overlay font families, first installed one wins.
size = 30  # Font size of the current line in pixels.
next_line = true  # Show the dimmed next line under the current one.
color = ""  # Color of sung words, e.g. "#CAAAF0". Empty uses the album accent.
monitor = ""  # Monitor connector to show on, e.g. "eDP-1". Empty follows the compositor.
style = "line"  # Overlay style: line (karaoke strip), stack (rolling word column), constellation (word chain) or visual (album art with the rolling column).

# 'hyde-shell encore hyprlock' configuration.
[encore.hyprlock]
color = ""  # Color of sung words, e.g. "#CAAAF0". Empty uses the album accent.
dim = ""  # Color of words not yet sung, e.g. "#FFFFFF80". Empty uses the album text color at 50%.
