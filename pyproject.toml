# Dev tooling for this repo only. Upstream HyDE ships its own pyproject in
# Configs/.local/lib/hyde; encore adds no runtime Python dependencies.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: runs the daemon against fake players on a private bus (deselect with -m \"not e2e\")"]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint.isort]
known-first-party = ["encorelib", "pyutils"]
